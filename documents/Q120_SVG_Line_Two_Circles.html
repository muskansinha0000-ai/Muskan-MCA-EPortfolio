<!DOCTYPE html>
<html>
<head><title>SVG Connection</title></head>
<body>
    <h2>Line Connecting Two Circles</h2>

    <svg width="400" height="200">

        <line x1="80" y1="100" x2="300" y2="100"
              stroke="black" stroke-width="4"/>

        <circle cx="80" cy="100" r="30" fill="blue"/>
        <circle cx="300" cy="100" r="30" fill="red"/>

    </svg>
</body>
</html>
