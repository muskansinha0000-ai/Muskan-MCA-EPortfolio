<!DOCTYPE html>
<html>
<head><title>Semantic Layout with SVG</title></head>
<body>
    <header>
        <h1>My Website</h1>
    </header>

    <main>
        <h2>Main Content</h2>
        <p>Welcome to my website.</p>
    </main>

    <aside>
        <h2>Related Information</h2>
        <p>Learn HTML5 and SVG.</p>
    </aside>

    <svg width="300" height="150">
        <circle cx="100" cy="70" r="50" fill="blue"/>
    </svg>

    <footer>
        <p>Copyright 2026</p>
    </footer>
</body>
</html>
