<!DOCTYPE html>
<html>
<head>
    <title>SVG Sunset Scene</title>
</head>
<body>

    <h1>Sunset Scene</h1>

    <svg width="500" height="300">

        <rect x="0" y="0" width="500" height="300"
              fill="skyblue"/>

        <circle cx="250" cy="130" r="60"
                fill="orange"/>

        <line x1="250" y1="20" x2="250" y2="50"
              stroke="orange" stroke-width="5"/>

        <line x1="150" y1="130" x2="180" y2="130"
              stroke="orange" stroke-width="5"/>

        <line x1="320" y1="130" x2="350" y2="130"
              stroke="orange" stroke-width="5"/>

        <line x1="180" y1="60" x2="200" y2="80"
              stroke="orange" stroke-width="5"/>

        <line x1="300" y1="80" x2="320" y2="60"
              stroke="orange" stroke-width="5"/>

        <rect x="0" y="200" width="500" height="100"
              fill="green"/>

    </svg>

</body>
</html>
