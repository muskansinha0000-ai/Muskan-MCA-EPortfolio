<!DOCTYPE html>
<html>
<head>
    <title>Canvas Gradient</title>
</head>
<body>

    <h1>Linear Gradient Rectangles</h1>

    <canvas id="myCanvas" width="400" height="250"
            style="border:1px solid black;">
    </canvas>

    <script>
        let canvas = document.getElementById("myCanvas");
        let ctx = canvas.getContext("2d");

        let gradient1 = ctx.createLinearGradient(0, 0, 200, 0);
        gradient1.addColorStop(0, "red");
        gradient1.addColorStop(1, "yellow");

        ctx.fillStyle = gradient1;
        ctx.fillRect(20, 30, 160, 80);

        let gradient2 = ctx.createLinearGradient(200, 0, 400, 0);
        gradient2.addColorStop(0, "blue");
        gradient2.addColorStop(1, "green");

        ctx.fillStyle = gradient2;
        ctx.fillRect(200, 130, 160, 80);
    </script>

</body>
</html>
