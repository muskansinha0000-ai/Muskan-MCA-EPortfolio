<!DOCTYPE html>
<html>
<head>
    <title>SVG Bar Chart</title>
</head>
<body>

    <header>
        <h1>Student Performance Dashboard</h1>
    </header>

    <nav>
        <a href="#home">Home</a> |
        <a href="#chart">Performance</a>
    </nav>

    <main>
        <section id="chart">
            <h2>Student Marks Bar Chart</h2>

            <svg width="400" height="300">

                <rect x="50" y="100" width="50" height="150"
                      fill="blue"/>
                <text x="50" y="270">HTML</text>

                <rect x="130" y="70" width="50" height="180"
                      fill="green"/>
                <text x="130" y="270">Python</text>

                <rect x="210" y="120" width="50" height="130"
                      fill="orange"/>
                <text x="210" y="270">DBMS</text>

                <rect x="290" y="50" width="50" height="200"
                      fill="red"/>
                <text x="290" y="270">Java</text>

            </svg>
        </section>
    </main>

    <aside>
        <h3>Performance</h3>
        <p>Student marks are displayed in the chart.</p>
    </aside>

    <footer>
        <p>Copyright 2026</p>
    </footer>

</body>
</html>
