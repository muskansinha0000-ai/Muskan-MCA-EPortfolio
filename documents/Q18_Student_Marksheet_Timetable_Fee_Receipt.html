<!DOCTYPE html>
<html>
<head>
    <title>HTML Tables</title>
</head>
<body>

    <h1>Student Marksheet</h1>

    <table border="1" cellpadding="8">
        <tr>
            <th>Subject</th>
            <th>Marks</th>
        </tr>
        <tr>
            <td>HTML</td>
            <td>85</td>
        </tr>
        <tr>
            <td>Python</td>
            <td>90</td>
        </tr>
        <tr>
            <td>DBMS</td>
            <td>88</td>
        </tr>
        <tr>
            <th>Total</th>
            <th>263</th>
        </tr>
    </table>

    <h1>Class Timetable</h1>

    <table border="1" cellpadding="8">
        <tr>
            <th>Day</th>
            <th>10-11 AM</th>
            <th>11-12 PM</th>
        </tr>
        <tr>
            <td>Monday</td>
            <td>HTML</td>
            <td>Python</td>
        </tr>
        <tr>
            <td>Tuesday</td>
            <td>DBMS</td>
            <td>Practical</td>
        </tr>
    </table>

    <h1>Fee Receipt</h1>

    <table border="1" cellpadding="8">
        <tr>
            <th>Receipt No.</th>
            <td>R001</td>
        </tr>
        <tr>
            <th>Student Name</th>
            <td>Aarav Sharma</td>
        </tr>
        <tr>
            <th>Course</th>
            <td>MCA</td>
        </tr>
        <tr>
            <th>Amount Paid</th>
            <td>25000</td>
        </tr>
        <tr>
            <th>Status</th>
            <td>Paid</td>
        </tr>
    </table>

</body>
</html>
