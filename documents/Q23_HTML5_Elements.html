<!DOCTYPE html>
<html>
<head>
    <title>HTML5 Elements</title>
</head>
<body>

    <h1>HTML5 Elements Demonstration</h1>

    <h2>Details and Summary</h2>
    <details>
        <summary>About HTML</summary>
        <p>HTML is used to create webpages.</p>
    </details>

    <h2>Progress</h2>
    <progress value="70" max="100"></progress>

    <h2>Meter</h2>
    <meter value="8" min="0" max="10"></meter>

    <h2>Dialog</h2>
    <dialog open>
        This is an HTML dialog box.
    </dialog>

    <h2>Figure Element</h2>
    <figure>
        <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=600"
             alt="Computer Workspace" width="300">
        <figcaption>Web Development Workspace</figcaption>
    </figure>

</body>
</html>
