<!DOCTYPE html>
<html>
<head>
    <title>Iframe Demonstration</title>
</head>
<body>

    <h1>Iframe Demonstration</h1>

    <h2>Google Maps</h2>
    <iframe
        src="https://www.google.com/maps?q=Pune%20India&output=embed"
        width="450"
        height="300">
    </iframe>

    <h2>Website</h2>
    <iframe
        src="https://www.wikipedia.org"
        width="450"
        height="300">
    </iframe>

    <h2>YouTube Video</h2>
    <iframe
        width="450"
        height="280"
        src="https://www.youtube.com/embed/tgbNymZ7vqY"
        allowfullscreen>
    </iframe>

</body>
</html>
