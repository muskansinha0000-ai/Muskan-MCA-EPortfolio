<!DOCTYPE html>
<html>
<head>
    <title>HTML Entities and Symbols</title>
</head>
<body>

    <h1>HTML Entities, Emojis and Symbols</h1>

    <h2>HTML Entities</h2>

    <p>Less Than: &lt;</p>
    <p>Greater Than: &gt;</p>
    <p>Ampersand: &amp;</p>
    <p>Copyright: &copy; 2026</p>
    <p>Registered: &reg;</p>
    <p>Rupee: &#8377;</p>
    <p>Non Breaking Space: Hello&nbsp;World</p>

    <h2>Emojis</h2>

    <p>😀 🎓 💻 📚 🌟</p>

    <h2>Special Symbols</h2>

    <p>Heart: &hearts;</p>
    <p>Multiplication: &times;</p>
    <p>Division: &divide;</p>
    <p>Degree: &deg;</p>

</body>
</html>
