<!DOCTYPE html>
<html>
<head><title>Contact Form</title></head>
<body>
    <h2>Contact Us</h2>
    <form>
        Name: <input type="text" name="name">
        <br><br>
        Email: <input type="email" name="email">
        <br><br>
        Phone: <input type="tel" name="phone">
        <br><br>
        Message:
        <textarea name="message"></textarea>
        <br><br>
        <input type="submit" value="Send">
    </form>
</body>
</html>
