<!DOCTYPE html>
<html>
<head><title>Phone Validation</title></head>
<body>
    <h2>Phone Number Form</h2>
    <form>
        Phone:
        <input type="tel" name="phone"
               pattern="[0-9]{10}"
               maxlength="10" required>
        <br><br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
