<!DOCTYPE html>
<html>
<head><title>Disabled Input</title></head>
<body>
    <h2>Disabled Input Example</h2>
    <form>
        Name:
        <input type="text" value="Aarav" disabled>
        <br><br>
        Email:
        <input type="email" value="aarav@mail.com" readonly>
    </form>
</body>
</html>
