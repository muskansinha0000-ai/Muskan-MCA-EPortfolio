<!DOCTYPE html>
<html>
<head><title>Telephone Input</title></head>
<body>
    <h2>Phone Number Form</h2>
    <form>
        Phone Number:
        <input type="tel" name="phone"
               placeholder="Enter 10 digit number"
               pattern="[0-9]{10}">
        <br><br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
