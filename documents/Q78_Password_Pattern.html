<!DOCTYPE html>
<html>
<head><title>Password Pattern</title></head>
<body>
    <h2>Password Validation</h2>
    <form>
        Password:
        <input type="password" name="password"
               pattern="(?=.*[A-Z])(?=.*[0-9]).{8,}"
               title="Minimum 8 characters, one capital letter and one number"
               required>
        <br><br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
