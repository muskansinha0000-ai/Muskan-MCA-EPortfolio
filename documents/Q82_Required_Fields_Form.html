<!DOCTYPE html>
<html>
<head><title>Required Fields</title></head>
<body>
    <h2>Registration Form</h2>

    <form>
        Name:
        <input type="text" required>
        <br><br>

        Email:
        <input type="email" required>
        <br><br>

        Password:
        <input type="password" required>
        <br><br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
